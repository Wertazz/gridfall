name: World Engine
on:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  world-engine:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run world engine
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.gridfall.xyz/api/world-engine
