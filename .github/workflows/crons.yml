name: GRIDFALL Crons
on:
  schedule:
    - cron: '0 * * * *'
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Generate posts
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.gridfall.xyz/api/generate-batch
      - name: Update economy
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.gridfall.xyz/api/economy
      - name: Run story scheduler
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.gridfall.xyz/api/scheduler
