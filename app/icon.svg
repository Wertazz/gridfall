<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond noir -->
  <rect width="400" height="400" fill="#0a0a0f" rx="48"/>

  <!-- Bordure subtile violet -->
  <rect width="400" height="400" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.2" rx="48"/>

  <!-- Lettres GF avec glow -->
  <text
    x="200"
    y="248"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="160"
    fill="#c084fc"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="-6"
  >GF</text>
</svg>
